spring:
  profiles:
    active: dev
  security:
    # # 启用SpringBootAdmin时，健康检查权限校验，不使用SpringBootAdmin此处可省略
    user:
      name: user
      password: password
      roles: ACTUATOR_ADMIN
  application:
    name: nuwa-service-gateway
#  main:
#    banner-mode: off
#    lazy-initialization: true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        username: nacos
        password: nacos
        group: DEFAULT_GROUP
        file-extension: yaml
        prefix: nuwa-service-gateway
        enabled: false  # docker 里禁掉；配置通过 application-dev.yml 兜底
        shared-configs: []

swagger:
  enabled: false
  groupName: nuwa-service-gateway
  basePackage: com.study.nuwa.cloud
  pathMapping: nuwa-service-gateway
