spring:
  profiles:
    active: dev
  application:
    name: nuwa-service-system
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        username: nacos
        password: nacos
        prefix: nuwa-service-system
        file-extension: yaml
        group: DEFAULT_GROUP
        enabled: false  # docker 里禁掉，避免 nacos shared-config 里的 localhost 覆盖容器网络
        shared-configs: []

swagger:
  enabled: true
  groupName: nuwa-service-system
  basePackage: com.study.service.system
  pathMapping: nuwa-service-system

logging:
  level:
    com.study.service.system.mapper: debug
