spring:
  profiles:
    active: dev
  application:
    name: nuwa-service-base
  cloud:
    nacos:
      discovery:
        # 允许通过环境变量 NACOS_SERVER_ADDR 覆盖（Docker 里用 nacos:8848，本地默认 127.0.0.1:8848）
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:ac59b1ea-e031-4aaf-a50e-2742b2f3da5f}
        group: DEFAULT_GROUP
        file-extension: yaml
        prefix: nuwa-service-base
        enabled: true
        shared-configs:
          - dataId: nuwa-share-feign.yaml
            group: DEFAULT_GROUP
            refresh: true
          - dataId: nuwa-share-database.yaml
            group: DEFAULT_GROUP
            refresh: true
          - dataId: nuwa-share-mybtis.yaml
            group: DEFAULT_GROUP
            refresh: true
          - dataId: nuwa-share-tenant.yaml
            group: DEFAULT_GROUP
            refresh: true
          - dataId: nuwa-share-redis.yaml
            group: DEFAULT_GROUP
            refresh: true
swagger:
  enabled: true
  groupName: nuwa-service-base
  basePackage: com.study.service.base
  pathMapping: nuwa-service-base