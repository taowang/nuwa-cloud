spring:
  profiles:
    active: dev
  application:
    name: nuwa-admin-monitor
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
        username: nacos
        password: nacos
        group: DEFAULT_GROUP
        prefix: nuwa-admin-monitor
        file-extension: yaml
        enabled: false  # docker 里禁掉；配置通过 application-dev.yml 兜底
        extension-configs: []
swagger:
  enabled: true
  groupName: nuwa-service-base
  basePackage: com.study.service.base
  pathMapping: nuwa-service-base

server:
  servlet:
    context-path: /${spring.application.name}